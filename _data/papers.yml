# Bibliografía de la materia. Alimenta papers.md.
#
# Los ejes de lectura siguen el calendario de la cátedra
# (https://fiubata050.github.io/calendario/): lo que no figura ahí no va.
# El último eje, `mencion: true`, junta lo que las clases citan al pasar o en
# notas sin que sea lectura asignada.
#
# `clases` es la lista de clases del calendario en que se discute (o se
# menciona). Las que ya tienen página en el sitio salen con link; las que
# todavía no, como número suelto.
#
# `url` es opcional: si no hay un enlace estable, va solo el título.

- eje: Fundamentos y método
  items:
    - titulo: "How to Read a Paper"
      autor: "S. Keshav"
      url: "https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf"
      clases: [1]
      nota: "El método de las tres pasadas. Conviene leerlo antes que cualquier otro."
    - titulo: "Principles of Computer System Design: An Introduction"
      autor: "Jerome H. Saltzer y M. Frans Kaashoek"
      url: "https://ocw.mit.edu/courses/res-6-004-principles-of-computer-system-design-an-introduction-spring-2009/"
      clases: [1]
      tipo: libro
      nota: "Caps. 2.1, 4.1 y 4.2. De acá sale el marco de las tres abstracciones —memoria, intérpretes, enlaces— y la organización cliente-servicio."
    - titulo: "Linearizability: A Correctness Condition for Concurrent Objects"
      autor: "Maurice Herlihy y Jeannette Wing"
      url: "https://pdos.csail.mit.edu/6.824/papers/p463-herlihy.pdf"
      clases: [7]
    - titulo: "Time, Clocks, and the Ordering of Events in a Distributed System"
      autor: "Leslie Lamport"
      url: "https://lamport.azurewebsites.net/pubs/time-clocks.pdf"
      clases: [8]
    - titulo: "Designing Data-Intensive Applications"
      autor: "Martin Kleppmann"
      url: "https://dataintensive.net/"
      clases: [3, 13, 14]
      tipo: libro
      nota: "Cap. 5, pp. 152–161, sobre replicación; cap. 11, pp. 439–451, sobre mensajería, y pp. 464–479, sobre procesamiento de streams."
    - titulo: "Distributed Systems: Concepts and Design (5.ª ed.)"
      autor: "George Coulouris, Jean Dollimore, Tim Kindberg y Gordon Blair"
      url: "https://www.cdk5.net/"
      clases: [8, 13]
      tipo: libro
      nota: "Caps. 14.1 a 14.4, sobre tiempo y relojes; caps. 6.1, 6.3 y 6.4, sobre comunicación indirecta."

